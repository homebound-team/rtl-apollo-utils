version: 2.1

orbs:
  node: circleci/node@5.1.0

node-image: &node-image
  image: cimg/node:24.21
  auth:
    username: $DOCKERHUB_USERNAME
    password: $DOCKERHUB_ACCESS_TOKEN

workflows:
  version: 2
  workflow:
    jobs:
      - build:
          context:
            - npm-readonly
            - dockerhub
      - publish:
          context:
            - npm-trusted-publish
            - npm-readonly
            - dockerhub
            - github
          requires:
            - build
          filters:
            branches:
              only:
                - main

commands:
  bootstrap:
    steps:
      - checkout
      - run: 'echo "npmAuthToken: $NPM_TOKEN" >> ${HOME}/.yarnrc.yml'
      - node/install-packages:
          pkg-manager: yarn-berry
          with-cache: true
          include-branch-in-cache-key: false

jobs:
  build:
    docker:
      - <<: *node-image
    steps:
      - bootstrap
      - run: yarn build
      - run: yarn test

  publish:
    docker:
      - <<: *node-image
    steps:
      - checkout
      # Private @homebound deps install via the project .yarnrc.yml `npmAuthToken: ${NPM_TOKEN}`
      # (npm-readonly). Publishing uses OIDC via the npm CLI, which ignores Yarn's token.
      - node/install-packages:
          pkg-manager: yarn-berry
          with-cache: true
          include-branch-in-cache-key: false
      - run:
          name: Release
          command: |
            export NPM_ID_TOKEN=$(circleci run oidc get --claims '{"aud":"npm:registry.npmjs.org"}')
            yarn semantic-release
